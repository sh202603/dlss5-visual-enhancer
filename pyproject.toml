[project]
name = "dlss5ve"
version = "0.1.0"
description = "DLSS 5 Visual Enhancer: NVIDIA DLSS 5 Neural Rendering and Frame Generation for images and videos"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.0",
    "av>=16.1",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
image = [
    "pillow>=11",
    "rawpy>=0.25",
    "pillow-heif>=1.0",
    "resvg-py>=0.5",
]
webui = [
    "gradio>=6.0",
    "dlss5ve[image]",
]

[project.scripts]
dlss5 = "dlss5ve.cli.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["."], include = ["dlss5ve", "dlss5ve.*"] } }

[tool.uv]
environments = ["sys_platform == 'win32'"]
