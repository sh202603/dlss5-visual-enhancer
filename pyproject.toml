[project]
name = "dlss5ve"
dynamic = ["version"]
description = "DLSS 5 Visual Enhancer: NVIDIA DLSS 5 Neural Rendering, Frame Generation, and RTX Video for images and videos"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.0",
    # PyAV 18: VideoFrame.from_dlpack and owned CUDA hwaccel devices (v8 NVDEC/NVENC path).
    "av>=18.1",
    "opencv-python-headless>=4.10",
    # The Custom NR Mask and the render note are decoded with Pillow in core.
    "pillow>=11",
]

[project.optional-dependencies]
image = [
    "rawpy>=0.25",
    "pillow-heif>=1.0",
    "resvg-py>=0.5",
]
webui = [
    "gradio>=6.0",
    "dlss5ve[image]",
]

[project.scripts]
dlss5ve-cli = "dlss5ve.cli.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["."], include = ["dlss5ve", "dlss5ve.*"] } }

[tool.setuptools.dynamic]
version = { attr = "dlss5ve.version.__version__" }

[tool.uv]
environments = ["sys_platform == 'win32'"]
